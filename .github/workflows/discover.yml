name: Daily Repository Discovery
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voshu-inspo-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py
      - name: Commit refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data CATALOG.md reports/daily
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh repository discovery'
            git push
          fi
